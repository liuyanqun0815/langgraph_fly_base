{% extends 'base.html' %}

{% block title %}上传文档 · LangGraph Fly{% endblock %}

{% block content %}
<div class="page">
    <div class="page-header">
        <h1>上传文档</h1>
        <p class="subtitle">将 PDF、Word、Excel 导入 Milvus 知识库</p>
    </div>

    <div class="page-card card">
        <div class="card__body">
            <form id="upload_form" method="post" enctype="multipart/form-data" action="/kb/upload_file"
                  class="form-grid" data-ajax-submit="true" data-on-success="alert">
                <div class="form-field">
                    <label for="collection_name">知识库名称</label>
                    <input type="text" id="collection_name" name="collection_name" required placeholder="例如：loan_qa">
                </div>
                <div class="form-field">
                    <label for="upload_type">导入类型</label>
                    <select name="upload_type" id="upload_type">
                        <option value="general">普通导入</option>
                        <option value="qa">QA 问答导入</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="file">选择文件</label>
                    <input type="file" id="file" name="file" required>
                    <p class="hint" id="file_type_info">允许的文件类型：PDF (.pdf), DOC (.doc), XLS (.xls), XLSX (.xlsx)</p>
                </div>
                <button type="submit" class="btn btn--block" data-loading-text="上传中…">上传文件</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('upload_type').addEventListener('change', function () {
        var fileTypeInfo = document.getElementById('file_type_info');
        if (this.value === 'general') {
            fileTypeInfo.textContent = '允许的文件类型：PDF (.pdf), DOC (.doc), XLS (.xls), XLSX (.xlsx)';
        } else {
            fileTypeInfo.textContent = '允许的文件类型：XLS (.xls), XLSX (.xlsx)';
        }
    });
</script>
{% endblock %}
